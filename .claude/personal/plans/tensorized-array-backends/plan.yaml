  title: RegionGraph builds tensorized RAT-SPNs; remove the jax package
  track: training
  branch: region-graphs-tensorized
  pull_request_number: 40
  session: local Claude Code session b2255295-8f97-432c-8420-621c5810b1cc
  depends_on: []
  status: in progress
  notes: 'Combines the former items region-graph-builds-tensorized (fork PR 37) and remove-jax-package
    (fork PR 38) at the developer''s request. Region graphs follow Algorithm 1 of the RAT-SPN
    paper: cross products in partitions, fully factorized leaf regions without a sum layer,
    regions of one variable are leaves. Classifiers train the joint likelihood; a cross-entropy
    loss as in the paper is a proposed follow-up. api-break: CouplingCircuit removed without
    replacement.

    '
