schema_version: 1
id: tensorized-array-backends
title: Tensorized circuits on any array backend
description: 'Run the tensorized layered circuits of probabilistic_model on numpy, jax and
  torch through the Python Array API standard, train them directly, and retire the duplicate
  jax package. Layers split into host structure (numpy indices fixed at construction) and
  backend parameters; numeric queries (log likelihood, CDF, probability of a simple event,
  moments) run on any backend, structural queries and sampling stay numpy on the host.

  '
default_repository: tomsch420/cognitive_robot_abstract_machine
waves:
- id: prerequisites
  name: Prerequisites
  description: Land the training fix and understand the row scaling before redesigning.
- id: foundation
  name: Structure and parameters
  description: Separate what is fixed per layer from what is trained, with no behaviour change.
- id: numeric-queries
  name: Numeric queries on any backend
  description: Route the numeric forward queries through the array namespace.
- id: consolidation
  name: Training and consolidation
  description: Train tensorized circuits, build RAT-SPNs as tensorized circuits, add torch,
    retire the jax package.
tracks:
- id: prerequisites
  name: Prerequisites
  wave: prerequisites
