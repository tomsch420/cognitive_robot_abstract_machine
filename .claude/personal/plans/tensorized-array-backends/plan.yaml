schema_version: 1
id: tensorized-array-backends
title: Tensorized circuits on any array backend
description: 'Run the tensorized layered circuits of probabilistic_model on numpy, jax and
  torch through the Python Array API standard, train them directly, and retire the duplicate
  jax package. Layers split into host structure (numpy indices fixed at construction) and
  backend parameters; numeric queries (log likelihood, CDF, probability of a simple event,
  moments) run on any backend, structural queries and sampling stay numpy on the host.

  '
default_repository: tomsch420/cognitive_robot_abstract_machine
waves:
- id: prerequisites
  name: Prerequisites
  description: Land the training fix and understand the row scaling before redesigning.
- id: foundation
  name: Structure and parameters
  description: Separate what is fixed per layer from what is trained, with no behaviour change.
- id: numeric-queries
  name: Numeric queries on any backend
  description: Route the numeric forward queries through the array namespace.
- id: consolidation
  name: Training and consolidation
  description: Train tensorized circuits, build RAT-SPNs as tensorized circuits, add torch,
    retire the jax package.
tracks:
- id: prerequisites
  name: Prerequisites
  wave: prerequisites
- id: foundation
  name: Structure and parameters split
  wave: foundation
- id: input-layers
  name: Input layers
  wave: numeric-queries
- id: inner-layers
  name: Inner layers
  wave: numeric-queries
- id: training
  name: Training and RAT-SPN
  wave: consolidation
- id: backends
  name: Further backends and cleanup
  wave: consolidation
items:
- id: inner-layers-any-backend
  title: Numeric queries of sum and product layers on any backend
  track: inner-layers
  branch: inner-layers-any-backend
  pull_request_number: 945
  session: local Claude Code session 979e5513-adbf-4494-91e0-87fd8fe46220
  depends_on: []
  status: in progress
  notes: 'Sum and product layers compute log likelihood, CDF, probability of a simple event
    and moments with xp. LayeredProbabilisticCircuit.log_likelihood accepts a backend array
    and returns one of the same backend. Tests run on numpy and jax. At the developer''s request
    the edges of both layers are an abstract EdgeMatrix with SparseEdgeMatrix and DenseEdgeMatrix
    subclasses, handled by polymorphism; structural queries keep the type of a layer''s edge
    matrix and store_edges_as converts. array_types splits into aliases of values of any backend
    and numpy arrays on the host.

    '
  repository: cram2/cognitive_robot_abstract_machine
- id: region-graph-builds-tensorized
  title: RegionGraph builds tensorized circuits
  track: training
  depends_on:
  - tensorized-training
  status: not started
  notes: 'to_probabilistic_circuit returns a LayeredProbabilisticCircuit with jax parameters,
    classification included. Its fully connected sum layers use DenseEdgeMatrix, which was
    1.6 to 2.2 times faster than SparseEdgeMatrix on fully connected layers on numpy and under
    jax.jit in PR 945, and 7 to 23 times slower on sparsely connected ones. Check against
    the RAT-SPN vs JPT benchmark (log likelihoods and training time on the 12 UCI datasets).

    '
- id: remove-jax-package
  title: Remove the jax package and its adapters
  track: backends
  depends_on:
  - region-graph-builds-tensorized
  status: not started
  notes: 'Delete probabilistic_circuit/jax and adapters/jax_tensorized once tensorized circuits
    train on jax and RegionGraph builds them. api-break PR: its description states the migration
    from DifferentiableLayeredCircuit to the tensorized circuit.

    '
- id: tensorized-training
  title: Train tensorized circuits through a functional loss
  branch: tensorized-training
  track: training
  pull_request_number: 35
  session: local Claude Code session 979e5513-adbf-4494-91e0-87fd8fe46220
  depends_on:
  - inner-layers-any-backend
  status: in progress
  notes: 'A pure function from parameters to log likelihood over the host structure, so jax.grad
    and jax.jit apply. Build on GradientDescent (PR 927) and keep the parameter constraints.
    The trainable sum layer parameter is log_weights in the layout of its edge matrix. Adds
    moving a circuit''s parameters to a backend and back; structural queries and sampling
    then raise a dedicated exception, and are documented as host only (absorbs the former
    host-only-structural-queries item).

    '

- id: torch-backend
  title: Torch backend
  branch: torch-backend
  track: backends
  pull_request_number: 36
  session: local Claude Code session 979e5513-adbf-4494-91e0-87fd8fe46220
  depends_on:
  - tensorized-training
  status: in progress
  notes: 'Numeric queries and training on torch, CPU and CUDA:
    TorchNormalDistributionFunctions through torch.special, arrays created on the device of
    the parameters, TorchGradientDescent with torch optimizers and autograd sharing the
    likelihood losses with jax. Torch is an optional extra, approved by the developer''s
    request for a torch backend. Stacked on tensorized-training as fork PR 36; it goes to
    cram2 once its base is merged.

    '
